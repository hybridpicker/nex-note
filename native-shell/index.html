<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nex Note</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fa;
        color: #0b0f14;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(2rem, env(safe-area-inset-top))
          max(2rem, env(safe-area-inset-right))
          max(2rem, env(safe-area-inset-bottom))
          max(2rem, env(safe-area-inset-left));
        box-sizing: border-box;
        background:
          radial-gradient(circle at 75% 15%, rgb(79 70 255 / 0.14), transparent 28rem),
          linear-gradient(145deg, #f8f8f5, #eef0ff);
      }

      main {
        width: min(38rem, 100%);
        padding: 2rem;
        border: 1px solid #e6e9ef;
        border-radius: 1.25rem;
        background: rgb(255 255 255 / 0.94);
        box-shadow: 0 24px 70px -44px rgb(11 15 20 / 0.55);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
      }

      p {
        margin: 0.6rem 0 0;
        color: #596174;
        line-height: 1.55;
      }

      code {
        border-radius: 0.35rem;
        background: #ecebff;
        padding: 0.12rem 0.4rem;
        color: #3f38e8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nex Note for iPad</h1>
      <p>This private test build is ready.</p>
      <p>
        Start <code>npm run ipad:dev</code> on the Mac and launch the app again to load
        the current local version.
      </p>
    </main>
  </body>
</html>
